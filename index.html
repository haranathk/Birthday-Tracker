  <script type="text/babel">

    const MONTH_NAMES = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];
    const SHORT_DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    const CARDS_CATALOG = [
      { id: 'c1', title: 'Hippo Birthday Cake', emoji: '🦛🎂', bg: 'bg-sky-50', defaultMsg: 'Wishing you the happiest of birthdays filled with joy and cake! 🎂✨' },
      { id: 'c2', title: 'Hippo Flowers & Balloon', emoji: '🦛🎈💐', bg: 'bg-amber-50', defaultMsg: 'Sending you warm wishes, flowers, and big smiles today! 💐🎈' },
      { id: 'c3', title: 'Party Balloons', emoji: '🎈🎊✨', bg: 'bg-teal-50', defaultMsg: 'Here is to another year of amazing adventures! Happy Birthday! 🎈🎊' },
      { id: 'c4', title: 'Sparkling Heart', emoji: '❤️✨', bg: 'bg-rose-50', defaultMsg: 'Sending lots of love on your special day! ❤️✨' },
      { id: 'c5', title: 'Wedding Rings', emoji: '💍🌹', bg: 'bg-orange-50', defaultMsg: 'Wishing you both a very Happy Anniversary and many more years of love! 💍🌹' },
      { id: 'c6', title: 'Champagne Pop', emoji: '🍾🥂✨', bg: 'bg-yellow-50', defaultMsg: 'Cheers to celebrating your special milestone! 🥂🍾' },
      { id: 'c7', title: 'Stack of Gifts', emoji: '🎁🎀🎉', bg: 'bg-purple-50', defaultMsg: 'May your year ahead be wrapped with happiness and surprises! 🎁🎉' }
    ];

    // Helper: Escape CSV field safely
    const escapeCSVField = (val) => {
      if (val === null || val === undefined) return '';
      const str = String(val);
      if (str.includes(',') || str.includes('"') || str.includes('\n')) {
        return `"${str.replace(/"/g, '""')}"`;
      }
      return str;
    };

    // Helper: Parse a single CSV line respecting quotes
    const parseCSVLine = (line) => {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        const nextChar = line[i + 1];
        if (inQuotes) {
          if (char === '"' && nextChar === '"') {
            current += '"';
            i++;
          } else if (char === '"') {
            inQuotes = false;
          } else {
            current += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            result.push(current.trim());
            current = '';
          } else {
            current += char;
          }
        }
      }
      result.push(current.trim());
      return result;
    };

    function HipFunctionalApp() {
      // ==================== PERSISTENT STATE ====================
      const [events, setEvents] = useState(() => {
        const saved = localStorage.getItem('hip_events_v1');
        return saved ? JSON.parse(saved) : INITIAL_EVENTS;
      });

      const [profile, setProfile] = useState(() => {
        const saved = localStorage.getItem('hip_profile_v1');
        return saved ? JSON.parse(saved) : {
          name: 'You',
          birthday: '',
          anniversary: '',
          customOccasionName: '',
          customOccasionDate: ''
        };
      });

      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('hip_settings_v1');
        return saved ? JSON.parse(saved) : {
          iCloudSync: false,
          showBanner: true,
          lastBackup: '04/07/22, 4:33 PM',
          sinceWeMetDate: '2020-01-01'
        };
      });

      const [cardHistory, setCardHistory] = useState(() => {
        const saved = localStorage.getItem('hip_card_history_v1');
        return saved ? JSON.parse(saved) : [];
      });

      useEffect(() => {
        localStorage.setItem('hip_events_v1', JSON.stringify(events));
      }, [events]);

      useEffect(() => {
        localStorage.setItem('hip_profile_v1', JSON.stringify(profile));
      }, [profile]);

      useEffect(() => {
        localStorage.setItem('hip_settings_v1', JSON.stringify(settings));
      }, [settings]);

      useEffect(() => {
        localStorage.setItem('hip_card_history_v1', JSON.stringify(cardHistory));
      }, [cardHistory]);

      // ==================== UI NAVIGATION & FILTER STATE ====================
      const [activeTab, setActiveTab] = useState('home');
      const [searchOpen, setSearchOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [typeFilter, setTypeFilter] = useState('All');
      const [onlyFavorites, setOnlyFavorites] = useState(false);

      // Modals & Detail Sheets
      const [selectedEventId, setSelectedEventId] = useState(null);
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [editingEvent, setEditingEvent] = useState(null);
      const [activeCard, setActiveCard] = useState(null);
      const [cardRecipientId, setCardRecipientId] = useState('');
      const [cardCustomMessage, setCardCustomMessage] = useState('');
      const [cardSubTab, setCardSubTab] = useState('cards');

      // Calendar State
      const today = new Date();
      const [calMonth, setCalMonth] = useState(today.getMonth());
      const [calYear, setCalYear] = useState(today.getFullYear());
      const [selectedCalDay, setSelectedCalDay] = useState(today.getDate());

      // Profile Edit Modal
      const [profileEditModal, setProfileEditModal] = useState(false);
      const fileInputRef = useRef(null);

      // ==================== DATE & AGE CALCULATION ENGINE ====================
      const enrichEvent = (ev) => {
        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());

        let nextDate = new Date(now.getFullYear(), ev.month - 1, ev.day);
        let diffTime = nextDate.getTime() - todayStart.getTime();
        let diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

        let isRecent = diffDays < 0 && diffDays >= -7;
        let recentDaysAgo = Math.abs(diffDays);

        if (diffDays < 0) {
          nextDate = new Date(now.getFullYear() + 1, ev.month - 1, ev.day);
          diffTime = nextDate.getTime() - todayStart.getTime();
          diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
        }

        const targetYear = nextDate.getFullYear();
        const yearsCount = ev.year ? targetYear - Number(ev.year) : null;
        const dayOfWeek = SHORT_DAYS[nextDate.getDay()];
        const paddedDay = String(ev.day).padStart(2, '0');
        const paddedMonth = String(ev.month).padStart(2, '0');

        let displayTitle = ev.name;
        if (ev.type === 'Birthday' && !ev.name.toLowerCase().includes('birthday') && ev.year) {
          displayTitle = `${ev.name} Birthday (${ev.year})`;
        } else if (ev.year) {
          displayTitle = `${ev.name} (${ev.year})`;
        }

        let subtitle = '';
        if (ev.type === 'Birthday' && yearsCount !== null && yearsCount > 0) {
          subtitle = `Turning ${yearsCount} • ${paddedDay}/${paddedMonth} • ${dayOfWeek}`;
        } else {
          subtitle = `${ev.type} • ${paddedDay}/${paddedMonth} • ${dayOfWeek}`;
        }

        const icon = ev.type === 'Birthday' ? '🎂' : ev.type === 'Marriage' ? '💍' : '✏️';

        return {
          ...ev,
          displayTitle,
          subtitle,
          daysLeft: diffDays,
          isRecent,
          recentDaysAgo,
          nextDate,
          targetYear,
          yearsCount,
          dayOfWeek,
          paddedDate: `${paddedDay}/${paddedMonth}`,
          initial: ev.name ? ev.name.trim().charAt(0).toUpperCase() : '?',
          icon
        };
      };

      const enrichedEvents = useMemo(() => {
        return events.map(enrichEvent).sort((a, b) => a.daysLeft - b.daysLeft);
      }, [events]);

      const filteredEvents = useMemo(() => {
        return enrichedEvents.filter(ev => {
          if (onlyFavorites && !ev.favorite) return false;
          if (typeFilter !== 'All' && ev.type !== typeFilter) return false;
          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase();
            return ev.name.toLowerCase().includes(q) || ev.type.toLowerCase().includes(q) || (ev.notes && ev.notes.toLowerCase().includes(q));
          }
          return true;
        });
      }, [enrichedEvents, onlyFavorites, typeFilter, searchQuery]);

      const selectedEvent = useMemo(() => {
        if (!selectedEventId) return null;
        return enrichedEvents.find(e => e.id === selectedEventId) || null;
      }, [selectedEventId, enrichedEvents]);

      const groupedSections = useMemo(() => {
        const recent = enrichedEvents.filter(e => e.isRecent);
        const todayList = filteredEvents.filter(e => e.daysLeft === 0);
        const laterThisWeek = filteredEvents.filter(e => e.daysLeft > 0 && e.daysLeft <= 7);
        const monthBuckets = {};

        filteredEvents.filter(e => e.daysLeft > 7).forEach(ev => {
          const monthHeader = `${MONTH_NAMES[ev.nextDate.getMonth()].toUpperCase()} ${ev.targetYear}`;
          if (!monthBuckets[monthHeader]) monthBuckets[monthHeader] = [];
          monthBuckets[monthHeader].push(ev);
        });

        return { recent, todayList, laterThisWeek, monthBuckets };
      }, [enrichedEvents, filteredEvents]);

      // ==================== CRUD HANDLERS ====================
      const [formState, setFormState] = useState({
        name: '',
        type: 'Birthday',
        day: today.getDate(),
        month: today.getMonth() + 1,
        year: '',
        phone: '',
        notes: '',
        favorite: false,
        reminderTime: '09:00'
      });

      const openAddModal = (preset = {}) => {
        setEditingEvent(null);
        setFormState({
          name: preset.name || '',
          type: preset.type || 'Birthday',
          day: preset.day || today.getDate(),
          month: preset.month || (today.getMonth() + 1),
          year: preset.year || '',
          phone: '',
          notes: '',
          favorite: false,
          reminderTime: '09:00'
        });
        setIsFormOpen(true);
      };

      const openEditModal = (ev) => {
        setEditingEvent(ev);
        setFormState({
          name: ev.name,
          type: ev.type,
          day: ev.day,
          month: ev.month,
          year: ev.year || '',
          phone: ev.phone || '',
          notes: ev.notes || '',
          favorite: !!ev.favorite,
          reminderTime: ev.reminderTime || '09:00'
        });
        setIsFormOpen(true);
      };

      const handleSaveEvent = (e) => {
        e.preventDefault();
        if (!formState.name.trim()) return;

        const payload = {
          id: editingEvent ? editingEvent.id : `ev-${Date.now()}`,
          name: formState.name.trim(),
          type: formState.type,
          day: Number(formState.day),
          month: Number(formState.month),
          year: formState.year ? Number(formState.year) : '',
          phone: formState.phone.trim(),
          notes: formState.notes.trim(),
          favorite: formState.favorite,
          reminderTime: formState.reminderTime
        };

        if (editingEvent) {
          setEvents(prev => prev.map(item => item.id === editingEvent.id ? payload : item));
        } else {
          setEvents(prev => [...prev, payload]);
        }
        setIsFormOpen(false);
      };

      const handleDeleteEvent = (id) => {
        if (window.confirm('Delete this event permanently?')) {
          setEvents(prev => prev.filter(item => item.id !== id));
          setSelectedEventId(null);
        }
      };

      const toggleFavorite = (id, e) => {
        if (e) e.stopPropagation();
        setEvents(prev => prev.map(item => item.id === id ? { ...item, favorite: !item.favorite } : item));
      };

      const updateEventNotes = (id, newNotes) => {
        setEvents(prev => prev.map(item => item.id === id ? { ...item, notes: newNotes } : item));
      };

      const shareMessage = async (text, phone = '') => {
        if (phone) {
          const cleanPhone = phone.replace(/[^0-9+]/g, '');
          window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(text)}`, '_blank');
          return;
        }
        if (navigator.share) {
          try {
            await navigator.share({ title: 'hip Wish', text });
            return;
          } catch (err) {}
        }
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      };

      // ==================== CSV EXPORT & IMPORT ====================
      const handleExportCSV = () => {
        const headers = ['Name', 'Type', 'Day', 'Month', 'Year', 'Phone', 'Notes', 'Favorite', 'ReminderTime'];
        const rows = events.map(ev => [
          escapeCSVField(ev.name),
          escapeCSVField(ev.type),
          escapeCSVField(ev.day),
          escapeCSVField(ev.month),
          escapeCSVField(ev.year || ''),
          escapeCSVField(ev.phone || ''),
          escapeCSVField(ev.notes || ''),
          escapeCSVField(ev.favorite ? 'TRUE' : 'FALSE'),
          escapeCSVField(ev.reminderTime || '09:00')
        ].join(','));

        // Add UTF-8 BOM (\uFEFF) so Excel opens special characters properly
        const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `hip-events-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);

        const nowStr = new Date().toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
        setSettings(s => ({ ...s, lastBackup: nowStr }));
      };

      const handleImportCSV = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const text = evt.target.result.replace(/^\uFEFF/, '');
            const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
            if (lines.length < 2) {
              alert('The CSV file appears to be empty or missing data rows.');
              return;
            }

            const headerCols = parseCSVLine(lines[0]).map(h => h.toLowerCase());
            const idxName = headerCols.indexOf('name');
            const idxType = headerCols.indexOf('type');
            const idxDay = headerCols.indexOf('day');
            const idxMonth = headerCols.indexOf('month');
            const idxYear = headerCols.indexOf('year');
            const idxPhone = headerCols.indexOf('phone');
            const idxNotes = headerCols.indexOf('notes');
            const idxFav = headerCols.indexOf('favorite');
            const idxRem = headerCols.indexOf('remindertime');

            const importedEvents = [];
            for (let i = 1; i < lines.length; i++) {
              const cols = parseCSVLine(lines[i]);
              const name = idxName !== -1 ? cols[idxName] : cols[0];
              if (!name) continue;

              const rawType = (idxType !== -1 ? cols[idxType] : cols[1]) || 'Birthday';
              const normalizedType = ['Birthday', 'Marriage', 'Other'].find(
                t => t.toLowerCase() === rawType.toLowerCase()
              ) || 'Other';

              const day = Math.min(31, Math.max(1, parseInt(idxDay !== -1 ? cols[idxDay] : cols[2], 10) || 1));
              const month = Math.min(12, Math.max(1, parseInt(idxMonth !== -1 ? cols[idxMonth] : cols[3], 10) || 1));
              const yearVal = idxYear !== -1 ? cols[idxYear] : cols[4];
              const year = yearVal && !isNaN(parseInt(yearVal, 10)) ? parseInt(yearVal, 10) : '';
              const phone = (idxPhone !== -1 ? cols[idxPhone] : cols[5]) || '';
              const notes = (idxNotes !== -1 ? cols[idxNotes] : cols[6]) || '';
              const favStr = ((idxFav !== -1 ? cols[idxFav] : cols[7]) || '').toLowerCase();
              const favorite = favStr === 'true' || favStr === 'yes' || favStr === '1';
              const reminderTime = (idxRem !== -1 ? cols[idxRem] : cols[8]) || '09:00';

              importedEvents.push({
                id: `ev-csv-${Date.now()}-${i}`,
                name,
                type: normalizedType,
                day,
                month,
                year,
                phone,
                notes,
                favorite,
                reminderTime
              });
            }

            if (importedEvents.length === 0) {
              alert('No valid event rows found in CSV.');
              return;
            }

            const shouldReplace = window.confirm(
              `Found ${importedEvents.length} events in CSV.\n\nClick OK to REPLACE your current list, or Cancel to MERGE (add) them to your current list.`
            );

            if (shouldReplace) {
              setEvents(importedEvents);
            } else {
              setEvents(prev => [...prev, ...importedEvents]);
            }

            alert(`Successfully imported ${importedEvents.length} events from CSV!`);
          } catch (err) {
            alert('Error reading CSV file. Please make sure it is a valid CSV.');
          }
          e.target.value = '';
        };
        reader.readAsText(file);
      };

      const testReminderNotification = async () => {
        if (!('Notification' in window)) {
          alert('Reminder Test: Next event is ' + (enrichedEvents[0]?.displayTitle || 'None'));
          return;
        }
        const perm = await Notification.requestPermission();
        if (perm === 'granted') {
          new Notification('🎂 hip Reminder Test', {
            body: `Working! Upcoming: ${enrichedEvents[0]?.displayTitle} in ${enrichedEvents[0]?.daysLeft} days.`
          });
        } else {
          alert(`Reminder Test Triggered!\nUpcoming: ${enrichedEvents[0]?.displayTitle} in ${enrichedEvents[0]?.daysLeft} days.`);
        }
      };

      // Calendar Helpers
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const firstDayOffset = new Date(calYear, calMonth, 1).getDay();
      const eventsInSelectedCalMonth = useMemo(() => {
        return enrichedEvents.filter(e => e.month === calMonth + 1);
      }, [enrichedEvents, calMonth]);

      const eventsOnSelectedCalDay = useMemo(() => {
        return eventsInSelectedCalMonth.filter(e => e.day === selectedCalDay);
      }, [eventsInSelectedCalMonth, selectedCalDay]);

      return (
        <div className="min-h-screen bg-neutral-950 flex justify-center items-center p-0 sm:p-4 font-sans select-none">
          {/* iPhone 16 Pro Frame */}
          <div className="w-full max-w-[402px] h-screen sm:h-[874px] bg-black text-white relative overflow-hidden flex flex-col sm:rounded-[52px] sm:border-[8px] sm:border-neutral-800 shadow-2xl">

            {/* iOS Status Bar */}
            <div className="flex justify-between items-center px-7 pt-3 pb-2 text-sm font-semibold z-20 shrink-0">
              <span>{new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false })}</span>
              <div className="w-28 h-7 bg-neutral-900 rounded-full hidden sm:block" />
              <div className="flex items-center gap-1.5 text-xs">
                <span>📶</span>
                <span className="bg-white text-black px-1.5 py-0.5 rounded text-[10px] font-bold">77</span>
              </div>
            </div>

            {/* ==================== MAIN CONTENT AREA ==================== */}
            <div className="flex-1 overflow-y-auto pb-28 scrollbar-none">

              {/* ==================== TAB 1: HOME ==================== */}
              {activeTab === 'home' && (
                <div className="px-4 pt-1">
                  <div className="flex items-center justify-between mb-3">
                    <div className="flex items-center bg-[#1c1c1e] rounded-full p-1 px-2.5 gap-2 border border-neutral-800">
                      <button
                        onClick={() => {
                          const order = ['All', 'Birthday', 'Marriage', 'Other'];
                          const next = order[(order.indexOf(typeFilter) + 1) % order.length];
                          setTypeFilter(next);
                        }}
                        className={`px-2 py-1 rounded-full text-xs font-bold flex items-center gap-1 ${
                          typeFilter !== 'All' ? 'bg-[#1d9bf0] text-white' : 'text-neutral-300'
                        }`}
                        title="Filter by Event Type"
                      >
                        <span>☰</span>
                        {typeFilter !== 'All' && <span>{typeFilter}</span>}
                      </button>
                      <button
                        onClick={() => setSearchOpen(!searchOpen)}
                        className={`p-1 rounded-full text-xs ${searchOpen ? 'text-[#1d9bf0]' : 'text-neutral-300'}`}
                        title="Search Events"
                      >
                        🔍
                      </button>
                    </div>

                    <div className="flex items-center bg-[#1c1c1e] rounded-full p-1 border border-neutral-800 text-xs">
                      <button
                        onClick={() => setOnlyFavorites(false)}
                        className={`p-1 px-3 rounded-full transition ${!onlyFavorites ? 'bg-[#2c2c2e] text-white font-bold' : 'text-neutral-400'}`}
                      >
                        👥 All
                      </button>
                      <button
                        onClick={() => setOnlyFavorites(true)}
                        className={`p-1 px-3 rounded-full transition ${onlyFavorites ? 'bg-[#2c2c2e] text-amber-400 font-bold' : 'text-neutral-400'}`}
                      >
                        ⭐ Favs
                      </button>
                    </div>

                    <button
                      onClick={() => openAddModal()}
                      className="bg-[#1c1c1e] p-2 rounded-full border border-neutral-800 text-sm"
                      title="Quick Add"
                    >
                      🌱
                    </button>
                  </div>

                  {/* Live Search Input */}
                  {searchOpen && (
                    <div className="mb-4 flex items-center bg-[#1c1c1e] border border-neutral-700 rounded-2xl px-3 py-2">
                      <span className="text-neutral-400 mr-2 text-sm">🔍</span>
                      <input
                        type="text"
                        value={searchQuery}

                            {enrichedEvents[0].daysLeft} Days<br />
                            {23 - new Date().getHours()} Hours<br />
                            {59 - new Date().getMinutes()} Minutes
                          </div>
                          <div className="h-1 bg-[#1d9bf0] rounded-full mt-2.5" />
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Interactive Settings Rows */}
                  <div className="divide-y divide-neutral-900 text-sm mt-2">
                    <div
                      onClick={() => {
                        const input = prompt('Enter date you met (YYYY-MM-DD):', settings.sinceWeMetDate);
                        if (input) setSettings(s => ({ ...s, sinceWeMetDate: input }));
                      }}
                      className="py-3 flex items-center justify-between cursor-pointer"
                    >
                      <div className="flex items-center gap-3">
                        <span>💖</span>
                        <div>
                          <div className="font-bold">Since We Met Counter</div>
                          <div className="text-neutral-400 text-xs">
                            {Math.max(0, Math.floor((new Date() - new Date(settings.sinceWeMetDate)) / (1000 * 60 * 60 * 24)))} days together (since {settings.sinceWeMetDate})
                          </div>
                        </div>
                      </div>
                      <span className="text-[#1d9bf0]">Edit ›</span>
                    </div>

                    <div className="py-3 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <span>☁️</span>
                        <div>
                          <div className="font-bold">Auto Local Storage Sync</div>
                          <div className="text-neutral-400 text-xs">All changes are automatically saved on device</div>
                        </div>
                      </div>
                      <button
                        onClick={() => setSettings(s => ({ ...s, iCloudSync: !s.iCloudSync }))}
                        className={`w-12 h-7 rounded-full p-1 transition ${
                          settings.iCloudSync ? 'bg-[#1d9bf0]' : 'bg-emerald-600'
                        }`}
                      >
                        <div className="w-5 h-5 rounded-full bg-white translate-x-5" />
                      </button>
                    </div>

                    {/* CSV Backup & Restore Row */}
                    <div className="py-3 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <span>📊</span>
                        <div>
                          <div className="font-bold">CSV Backup & Restore</div>
                          <div className="text-[#f06478] text-xs">Last backup: {settings.lastBackup}</div>
                        </div>
                      </div>
                      <div className="flex gap-2">
                        <button
                          onClick={handleExportCSV}
                          className="bg-[#1c1c1e] border border-neutral-700 px-2.5 py-1.5 rounded-lg text-xs font-bold text-[#1d9bf0] active:scale-95"
                        >
                          Export CSV
                        </button>
                        <button
                          onClick={() => fileInputRef.current?.click()}
                          className="bg-[#1c1c1e] border border-neutral-700 px-2.5 py-1.5 rounded-lg text-xs font-bold text-white active:scale-95"
                        >
                          Import CSV
                        </button>
                        <input
                          ref={fileInputRef}
                          type="file"
                          accept=".csv,text/csv"
                          onChange={handleImportCSV}
                          className="hidden"
                        />
                      </div>
                    </div>

                    <div
                      onClick={testReminderNotification}
                      className="py-3 flex items-center justify-between cursor-pointer"
                    >
                      <div className="flex items-center gap-3">
                        <span>☑️</span>
                        <div>
                          <div className="font-bold">Run Reminder Test</div>
                          <div className="text-[#1d9bf0] text-xs font-medium">Tap to test notification alert</div>
                        </div>
                      </div>
                      <span className="text-[#1d9bf0]">Run ›</span>
                    </div>

                    <div
                      onClick={() => {
                        if (window.confirm('Reset app back to original 6 default events?')) {
                          setEvents(INITIAL_EVENTS);
                        }
                      }}
                      className="py-3 flex items-center justify-between cursor-pointer"
                    >
                      <div className="flex items-center gap-3">
                        <span>🔄</span>
                        <div>
                          <div className="font-bold text-rose-400">Reset Default Demo Data</div>
                          <div className="text-neutral-500 text-xs">Restore original screenshot records</div>
                        </div>
                      </div>
                      <span className="text-neutral-500">›</span>
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* ==================== EVENT DETAILS FULL MODAL ==================== */}
            {selectedEvent && (
              <div className="absolute inset-0 bg-black z-30 flex flex-col animate-fadeIn">
                <div className="flex items-center justify-between px-4 py-3 border-b border-neutral-900">
                  <button
                    onClick={() => setSelectedEventId(null)}
                    className="bg-[#1c1c1e] px-3 py-1.5 rounded-full text-xs font-bold text-[#1d9bf0]"
                  >
                    ‹ Back
                  </button>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={(e) => toggleFavorite(selectedEvent.id, e)}
                      className={`p-2 rounded-full bg-[#1c1c1e] text-sm ${selectedEvent.favorite ? 'text-amber-400' : 'text-neutral-400'}`}
                    >
                      ★
                    </button>
                    <button
                      onClick={() => openEditModal(selectedEvent)}
                      className="bg-[#1c1c1e] px-3 py-1.5 rounded-full text-xs font-bold text-[#1d9bf0]"
                    >
                      Edit
                    </button>
                    <button
                      onClick={() => handleDeleteEvent(selectedEvent.id)}
                      className="bg-rose-950/60 px-3 py-1.5 rounded-full text-xs font-bold text-rose-400"
                    >
                      Delete
                    </button>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto p-5 space-y-5 scrollbar-none">
                  <div className="flex flex-col items-center text-center">
                    <div className="relative w-20 h-20 rounded-full bg-[#cce4f7] text-[#1d82d8] flex items-center justify-center font-bold text-3xl mb-3 shadow-lg">
                      {selectedEvent.initial}
                      <span className="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-[#f06478] text-white flex items-center justify-center border-2 border-black text-base">
                        {selectedEvent.icon}
                      </span>
                    </div>
                    <h2 className="text-xl font-bold">{selectedEvent.displayTitle}</h2>
                    <p className="text-neutral-400 text-sm mt-1">{selectedEvent.subtitle}</p>
                  </div>

                  <div className="bg-[#1c1c1e] border border-neutral-800 rounded-2xl p-4 text-center">
                    <div className="text-xs font-bold text-[#f06478] uppercase tracking-wider mb-1">
                      {selectedEvent.daysLeft === 0 ? '🎉 Happening Today!' : '⏳ Upcoming Countdown'}
                    </div>
                    <div className="grid grid-cols-3 gap-2 mt-3">
                      <div className="bg-black rounded-xl p-2.5">
                        <div className="text-xl font-extrabold text-[#1d9bf0]">{selectedEvent.daysLeft}</div>
                        <div className="text-[10px] text-neutral-400 uppercase">Days</div>
                      </div>
                      <div className="bg-black rounded-xl p-2.5">
                        <div className="text-xl font-extrabold text-[#1d9bf0]">{23 - new Date().getHours()}</div>
                        <div className="text-[10px] text-neutral-400 uppercase">Hours</div>
                      </div>
                      <div className="bg-black rounded-xl p-2.5">
                        <div className="text-xl font-extrabold text-[#1d9bf0]">{59 - new Date().getMinutes()}</div>
                        <div className="text-[10px] text-neutral-400 uppercase">Minutes</div>
                      </div>
                    </div>
                    {selectedEvent.yearsCount !== null && (
                      <div className="text-xs text-neutral-300 mt-3 font-medium">
                        {selectedEvent.type === 'Birthday'
                          ? `Turning ${selectedEvent.yearsCount} years old on ${selectedEvent.paddedDate}/${selectedEvent.targetYear}`
                          : `Completing ${selectedEvent.yearsCount} years on ${selectedEvent.paddedDate}/${selectedEvent.targetYear}`}
                      </div>
                    )}
                  </div>

                  <div className="grid grid-cols-3 gap-2.5">
                    <button
                      onClick={() =>
                        shareMessage(
                          selectedEvent.type === 'Birthday'
                            ? `Happy Birthday ${selectedEvent.name}! 🎂🎉 Wishing you a wonderful year ahead!`
                            : `Happy ${selectedEvent.type} wishes ${selectedEvent.name}! 🎉✨`,
                          selectedEvent.phone
                        )
                      }
                      className="bg-[#1d9bf0] text-white py-3 rounded-2xl font-bold text-xs flex flex-col items-center gap-1 shadow"
                    >
                      <span className="text-lg">💬</span>
                      <span>WhatsApp Wish</span>
                    </button>

                    <button
                      onClick={() => {
                        setSelectedEventId(null);
                        setActiveTab('cards');
                        setActiveCard(CARDS_CATALOG[0]);
                        setCardRecipientId(selectedEvent.id);
                        setCardCustomMessage(`Happy ${selectedEvent.type} ${selectedEvent.name}! 🎂🎉`);
                      }}
                      className="bg-[#f06478] text-white py-3 rounded-2xl font-bold text-xs flex flex-col items-center gap-1 shadow"
                    >
                      <span className="text-lg">🦛</span>
                      <span>Send hip Card</span>
                    </button>

                    <button
                      onClick={() => {
                        if (selectedEvent.phone) {
                          window.open(`tel:${selectedEvent.phone}`);
                        } else {
                          openEditModal(selectedEvent);
                        }
                      }}
                      className="bg-[#1c1c1e] border border-neutral-800 text-white py-3 rounded-2xl font-bold text-xs flex flex-col items-center gap-1"
                    >
                      <span className="text-lg">📞</span>
                      <span>{selectedEvent.phone ? 'Call Now' : 'Add Phone'}</span>
                    </button>
                  </div>

                  <div className="bg-[#1c1c1e] rounded-2xl p-4 space-y-2.5 text-xs border border-neutral-800">
                    <div className="flex justify-between">
                      <span className="text-neutral-400">Occasion Type</span>
                      <span className="font-bold">{selectedEvent.type}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-neutral-400">Event Date</span>
                      <span className="font-bold">
                        {selectedEvent.day} {MONTH_NAMES[selectedEvent.month - 1]} {selectedEvent.year || '(Every Year)'}
                      </span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-neutral-400">Reminder Time</span>
                      <span className="font-bold text-[#1d9bf0]">🔔 {selectedEvent.reminderTime || '09:00'}</span>
                    </div>
                    {selectedEvent.phone && (
                      <div className="flex justify-between">
                        <span className="text-neutral-400">Phone</span>
                        <span className="font-bold">{selectedEvent.phone}</span>
                      </div>
                    )}
                  </div>

                  <div className="bg-[#1c1c1e] rounded-2xl p-4 border border-neutral-800">
                    <div className="text-xs font-bold text-neutral-400 uppercase mb-2">
                      🎁 Gift Ideas & Personal Notes (Auto-Saved)
                    </div>
                    <textarea
                      rows="3"
                      value={selectedEvent.notes || ''}
                      onChange={(e) => updateEventNotes(selectedEvent.id, e.target.value)}
                      placeholder="Tap to type gift ideas, cake flavors, or notes for this event..."
                      className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-[#1d9bf0]"
                    />
                  </div>
                </div>
              </div>
            )}

            {/* ==================== ADD / EDIT EVENT MODAL ==================== */}
            {isFormOpen && (
              <div className="absolute inset-0 bg-black/85 z-40 flex items-end">
                <form
                  onSubmit={handleSaveEvent}
                  className="w-full bg-[#1c1c1e] rounded-t-3xl p-5 space-y-3.5 border-t border-neutral-800 max-h-[88vh] overflow-y-auto"
                >
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-base">
                      {editingEvent ? 'Edit Event' : 'Add Special Day'}
                    </h3>
                    <button type="button" onClick={() => setIsFormOpen(false)} className="text-neutral-400 text-lg">✕</button>
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-neutral-400 uppercase">Person / Event Name *</label>
                    <input
                      type="text"
                      placeholder="e.g. Suman Kasturi or Gruhapravesham"
                      value={formState.name}
                      onChange={e => setFormState({ ...formState, name: e.target.value })}
                      className="w-full mt-1 bg-black border border-neutral-800 rounded-xl px-3.5 py-2.5 text-sm text-white"
                      required
                    />
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-neutral-400 uppercase">Occasion Category</label>
                    <div className="grid grid-cols-3 gap-2 mt-1">
                      {['Birthday', 'Marriage', 'Other'].map(cat => (
                        <button
                          type="button"
                          key={cat}
                          onClick={() => setFormState({ ...formState, type: cat })}
                          className={`py-2 rounded-xl text-xs font-bold border ${
                            formState.type === cat
                              ? 'bg-[#1d9bf0] text-white border-[#1d9bf0]'
                              : 'bg-black text-neutral-400 border-neutral-800'
                          }`}
                        >
                          {cat === 'Birthday' ? '🎂 Birthday' : cat === 'Marriage' ? '💍 Marriage' : '✏️ Other'}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-[11px] font-bold text-neutral-400 uppercase">Day</label>
                      <select
                        value={formState.day}
                        onChange={e => setFormState({ ...formState, day: Number(e.target.value) })}
                        className="w-full mt-1 bg-black border border-neutral-800 rounded-xl px-2.5 py-2.5 text-sm text-white"
                      >
                        {Array.from({ length: 31 }, (_, i) => i + 1).map(d => (
                          <option key={d} value={d}>{d}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="text-[11px] font-bold text-neutral-400 uppercase">Month</label>
                      <select
                        value={formState.month}
                        onChange={e => setFormState({ ...formState, month: Number(e.target.value) })}
                        className="w-full mt-1 bg-black border border-neutral-800 rounded-xl px-2.5 py-2.5 text-sm text-white"
                      >
                        {MONTH_NAMES.map((m, idx) => (
                          <option key={m} value={idx + 1}>{m.slice(0, 3)}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="text-[11px] font-bold text-neutral-400 uppercase">Year (Opt)</label>
                      <input
                        type="number"
                        placeholder="e.g. 1976"
                        value={formState.year}
                        onChange={e => setFormState({ ...formState, year: e.target.value })}
                        className="w-full mt-1 bg-black border border-neutral-800 rounded-xl px-2.5 py-2.5 text-sm text-white"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[11px] font-bold text-neutral-400 uppercase">WhatsApp / Phone</label>
                      <input
                        type="tel"
                        placeholder="+91 98765..."
                        value={formState.phone}
                        onChange={e => setFormState({ ...formState, phone: e.target.value })}
                        className="w-full mt-1 bg-black border border-neutral-800 rounded-xl px-3 py-2 text-sm text-white"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] font-bold text-neutral-400 uppercase">Reminder Time</label>
                      <input
                        type="time"
                        value={formState.reminderTime}
                        onChange={e => setFormState({ ...formState, reminderTime: e.target.value })}
                        className="w-full mt-1 bg-black border border-neutral-800 rounded-xl px-3 py-2 text-sm text-white"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-neutral-400 uppercase">Gift Ideas / Notes</label>
                    <input
                      type="text"
                      placeholder="Optional note or gift reminder..."
                      value={formState.notes}
                      onChange={e => setFormState({ ...formState, notes: e.target.value })}
                      className="w-full mt-1 bg-black border border-neutral-800 rounded-xl px-3.5 py-2 text-sm text-white"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-[#1d9bf0] text-white font-bold py-3 rounded-xl text-sm shadow-lg"
                  >
                    {editingEvent ? 'Update Event' : 'Save Event'}
                  </button>
                </form>
              </div>
            )}

            {/* ==================== CARD CUSTOMIZER MODAL ==================== */}
            {activeCard && (
              <div className="absolute inset-0 bg-black/85 z-40 flex items-end">
                <div className="w-full bg-[#1c1c1e] rounded-t-3xl p-5 space-y-4 border-t border-neutral-800">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-base">Customize & Send Card</h3>
                    <button onClick={() => setActiveCard(null)} className="text-neutral-400">✕</button>
                  </div>

                  <div className={`${activeCard.bg} rounded-2xl p-6 text-center text-neutral-900 shadow-inner`}>
                    <div className="text-5xl mb-2">{activeCard.emoji}</div>
                    <div className="font-extrabold text-sm mb-1">{activeCard.title}</div>
                    <p className="text-xs text-neutral-700 italic">"{cardCustomMessage}"</p>
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-neutral-400 uppercase">Choose Recipient</label>
                    <select
                      value={cardRecipientId}
                      onChange={e => setCardRecipientId(e.target.value)}
                      className="w-full mt-1 bg-black border border-neutral-800 rounded-xl px-3 py-2.5 text-sm text-white"
                    >
                      <option value="">Anyone (Choose in WhatsApp)</option>
                      {enrichedEvents.map(ev => (
                        <option key={ev.id} value={ev.id}>{ev.displayTitle}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-neutral-400 uppercase">Your Personal Message</label>
                    <textarea
                      rows="2"
                      value={cardCustomMessage}
                      onChange={e => setCardCustomMessage(e.target.value)}
                      className="w-full mt-1 bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white"
                    />
                  </div>

                  <button
                    onClick={() => {
                      const rec = enrichedEvents.find(e => e.id === cardRecipientId);
                      const fullText = `${activeCard.emoji} *${activeCard.title}*\n${rec ? `Dear ${rec.name},\n` : ''}${cardCustomMessage}`;
                      setCardHistory(prev => [
                        {
                          emoji: activeCard.emoji,
                          cardTitle: activeCard.title,
                          recipientName: rec ? rec.name : 'Friend',
                          message: cardCustomMessage,
                          date: new Date().toLocaleDateString()
                        },
                        ...prev
                      ]);
                      setActiveCard(null);
                      shareMessage(fullText, rec?.phone || '');
                    }}
                    className="w-full bg-[#1d9bf0] text-white font-bold py-3 rounded-xl text-sm"
                  >
                    Share Card via WhatsApp / iMessage 📤
                  </button>
                </div>
              </div>
            )}

            {/* ==================== PROFILE EDIT MODAL ==================== */}
            {profileEditModal && (
              <div className="absolute inset-0 bg-black/85 z-40 flex items-end">
                <div className="w-full bg-[#1c1c1e] rounded-t-3xl p-5 space-y-3.5 border-t border-neutral-800">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-base">Edit Your Special Days</h3>
                    <button onClick={() => setProfileEditModal(false)} className="text-neutral-400">✕</button>
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-neutral-400 uppercase">Your Name</label>
                    <input
                      type="text"
                      value={profile.name}
                      onChange={e => setProfile({ ...profile, name: e.target.value })}
                      className="w-full mt-1 bg-black border border-neutral-800 rounded-xl px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-neutral-400 uppercase">Your Birthday</label>
                    <input
                      type="date"
                      value={profile.birthday}
                      onChange={e => setProfile({ ...profile, birthday: e.target.value })}
                      className="w-full mt-1 bg-black border border-neutral-800 rounded-xl px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-neutral-400 uppercase">Your Anniversary</label>
                    <input
                      type="date"
                      value={profile.anniversary}
                      onChange={e => setProfile({ ...profile, anniversary: e.target.value })}
                      className="w-full mt-1 bg-black border border-neutral-800 rounded-xl px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[11px] font-bold text-neutral-400 uppercase">Custom Occasion Title</label>
                      <input
                        type="text"
                        placeholder="e.g. Graduation"
                        value={profile.customOccasionName}
                        onChange={e => setProfile({ ...profile, customOccasionName: e.target.value })}
                        className="w-full mt-1 bg-black border border-neutral-800 rounded-xl px-3 py-2 text-sm text-white"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] font-bold text-neutral-400 uppercase">Occasion Date</label>
                      <input
                        type="date"
                        value={profile.customOccasionDate}
                        onChange={e => setProfile({ ...profile, customOccasionDate: e.target.value })}
                        className="w-full mt-1 bg-black border border-neutral-800 rounded-xl px-3 py-2 text-sm text-white"
                      />
                    </div>
                  </div>
                  <button
                    onClick={() => setProfileEditModal(false)}
                    className="w-full bg-[#1d9bf0] text-white font-bold py-2.5 rounded-xl text-sm"
                  >
                    Save Profile
                  </button>
                </div>
              </div>
            )}

            {/* ==================== FLOATING BOTTOM NAVIGATION BAR ==================== */}
            <div className="absolute bottom-5 inset-x-4 z-20">
              <div className="bg-[#161618]/95 backdrop-blur-md border border-neutral-800/80 rounded-full p-1.5 flex justify-between items-center shadow-2xl">
                {[
                  { id: 'home', label: '🏠' },
                  { id: 'calendar', label: '📅' },
                  { id: 'cards', label: '💬' },
                  { id: 'profile', label: '👤' },
                  { id: 'settings', label: '⚙️', badge: settings.showBanner }
                ].map(tab => {
                  const isActive = activeTab === tab.id;
                  return (
                    <button
                      key={tab.id}
                      onClick={() => {
                        setSelectedEventId(null);
                        setActiveTab(tab.id);
                      }}
                      className={`relative flex-1 py-2 rounded-full flex justify-center items-center transition text-lg ${
                        isActive ? 'bg-black text-[#1d9bf0]' : 'text-white opacity-80'
                      }`}
                    >
                      <span>{tab.label}</span>
                      {tab.badge && (
                        <span className="absolute top-1.5 right-4 w-2.5 h-2.5 bg-[#f06478] rounded-full" />
                      )}
                    </button>
                  );
                })}
              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HipFunctionalApp />);
  </script>
</body>
</html>
